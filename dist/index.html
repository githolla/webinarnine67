-items:center;gap:15px}h1,h2,h3,p{margin:0}h1{font:52px/1.1 'Libre Caslon Display',Georgia,serif;letter-spacing:-1.1px;margin-bottom:12px}h2{font:30px 'Libre Caslon Display',Georgia,serif}h3{font-size:15px}.sub{color:var(--muted);line-height:1.7}.primary{border-radius:30px;background:var(--navy);color:white;padding:13px 20px;white-space:nowrap}.secondary{background:white;border:1px solid var(--line);border-radius:30px;padding:11px 17px;color:var(--ink)}.blue{color:var(--blue)}.walk{display:flex;align-items:center;gap:12px;margin:28px 0;background:#eaf0ef;padding:13px 18px;border-radius:10px;font-size:12px;color:#516e76}.walk strong{color:var(--ink)}.walk button{margin-left:auto;background:transparent;color:var(--blue);white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:21px}.metric label{font-size:11px;color:#6d7f88}.value{font-size:30px;letter-spacing:-1px;margin:13px 0 8px}.metric-foot{font-size:11px;color:#7a858a}.pill{font-size:10px;padding:5px 9px;border-radius:20px;display:inline-block;background:#f6ede2;color:#986332}.pill.green{background:#eaf3ee;color:var(--green)}.pill.blue{background:#e8f2f7;color:var(--blue)}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,1fr);gap:20px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}.issue{padding:19px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:start}.issue-num{border:1px solid #dce3e4;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:11px;color:#7b8a90}.issue h3{margin:2px 0 8px}.issue p{font-size:12px;line-height:1.6;color:var(--muted)}.issue button{background:transparent;color:var(--blue);font-size:20px;padding:0 5px}.issue-meta{font-size:10px;color:#879298;margin-top:12px}.chart{display:flex;align-items:end;gap:16px;height:138px;padding:15px 3px 0;border-bottom:1px solid var(--line);margin-top:20px}.bar-group{flex:1;height:100%;display:flex;gap:5px;align-items:end;position:relative}.bar{flex:1;background:#203f52;border-radius:3px 3px 0 0}.bar.target{background:#dce6e8}.chart-labels{display:flex;justify-content:space-around;font-size:10px;color:#819098;margin:10px 0 19px}.note{font-size:12px;line-height:1.7;color:var(--muted);padding-top:17px;border-top:1px solid var(--line)}.bottom{margin-top:20px;background:#e9efed;border:1px solid #dbe4df;padding:18px 22px;border-radius:12px;display:flex;align-items:center;gap:16px}.bottom p{font-size:12px;color:#6a7f80;margin-top:5px}.bottom button{margin-left:auto}.footer{display:flex;justify-content:space-between;gap:15px;font-size:10px;color:#869397;margin-top:25px}.back{border:0;background:transparent;color:var(--blue);padding:0;margin-bottom:22px}.detail-stat{background:var(--navy);color:white}.detail-stat .eyebrow{color:#abc0cc}.big{font:55px 'Libre Caslon Display',Georgia,serif;margin:16px 0}.detail-stat p{font-size:12px;color:#c0cdd3;line-height:1.8}.table{width:100%;border-collapse:collapse;font-size:12px;margin:20px 0}.table td,.table th{text-align:left;padding:14px 8px;border-bottom:1px solid var(--line)}.table th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.callout{border-left:3px solid #bc874a;background:#fbf6ef;padding:16px;font-size:12px;line-height:1.8;margin:18px 0}.stack{display:grid;gap:18px}.source{display:flex;align-items:center;gap:12px;padding:18px 0;border-top:1px solid var(--line)}.source div{flex:1}.source p{font-size:12px;color:var(--muted);margin-top:5px}.brief{padding:35px 40px;max-width:850px;margin:auto;background:white;border:1px solid var(--line);border-radius:12px}.brief h2{font-size:39px;margin:15px 0}.brief h3{margin:25px 0 10px}.brief p,.brief li{font-size:13px;color:#5d707b;line-height:1.9}.brief ul{padding-left:20px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}.stepper{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.step{background:white;border:1px solid var(--line);padding:9px 16px;border-radius:25px;color:#71818a;font-size:12px}.step.selected{background:var(--navy);color:white}.before-after{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:25px}.process{list-style:none;padding:0;counter-reset:process}.process li{padding:15px 0;border-bottom:1px solid var(--line);line-height:1.6;font-size:13px}.process li small{display:block;color:var(--muted);margin-top:5px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 24px;background:var(--navy);color:white;border-radius:30px;z-index:99;box-shadow:0 5px 30px #10263633}.hidden{display:none!important}.owner{display:flex;align-items:center;gap:10px;margin-top:18px}.avatar{border-radius:50%;width:33px;height:33px;display:grid;place-items:center;background:#e5ecec;font-size:11px}.owner small{display:block;color:var(--muted);margin-top:4px}.question{padding:13px 17px;text-align:left;background:#f3f7f7;border-radius:8px;border:1px solid var(--line);color:#3e6478;width:100%;margin-top:10px}.answer{padding:15px;background:#edf4f5;font-size:12px;line-height:1.9;margin-top:12px;border-radius:8px}.meeting{font-size:11px;color:var(--muted);text-align:right;line-height:1.8}@media(min-width:1500px){.main{padding-top:50px}}@media(max-width:1050px){.main{padding:28px 24px}.shell{grid-template-columns:180px 1fr}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}h1{font-size:44px}.header-right>span{display:none}}@media(max-width:650px){header{padding:0 20px;height:68px}.brand small{display:none}.shell{display:block}aside{padding:12px;border-right:0;border-bottom:1px solid var(--line)}aside>.eyebrow,.aside-bottom{display:none}nav{display:flex;overflow:auto;gap:4px}.nav{white-space:nowrap;font-size:11px;padding:10px}.nav span{display:none}.main{padding:25px 18px}.title-row{display:block}.title-row>.primary{margin-top:18px}h1{font-size:41px}.meeting{display:none}.walk{align-items:start}.metrics{gap:10px}.card{padding:17px}.value{font-size:27px}.before-after{grid-template-columns:1fr}.bottom{align-items:start;flex-wrap:wrap}.bottom button{margin-left:0}.brief{padding:25px}.footer{flex-direction:column}.header-right{gap:5px}.outline{font-size:11px}.issue{grid-template-columns:25px 1fr auto}.tag{font-size:9px}}

</style><link rel="stylesheet" href="webinar.css"><link rel="stylesheet" href="brand.css"></head><body><div id="stage"></div><header><a href="#overview" class="brand">Nine-67<small>THE EXECUTIVE WORKSPACE</small></a><div class="header-right"><span><i class="dot"></i>Vesper Flight Systems · Demo company</span><button class="outline" onclick="resetDemo()">Reset demo ↺</button></div></header><div class="shell"><aside><div class="eyebrow">Your workspace</div><nav aria-label="Main navigation"><button class="nav active" data-page="overview" onclick="go('overview')"><span>◫</span>Executive overview</button><button class="nav" data-page="workflow" onclick="go('workflow')"><span>⇄</span>The work behind it</button><button class="nav" data-page="sources" onclick="go('sources')"><span>▤</span>Sources & readiness</button><button class="nav" data-page="brief" onclick="go('brief')"><span>≡</span>Leadership brief</button><button class="nav" data-page="actions" onclick="go('actions')"><span>✓</span>Decisions & actions</button></nav><div class="aside-bottom"><div class="eyebrow" style="padding:0">Built around your work</div>A clearer picture.<br>A prepared team.<br>A decision that moves forward.<br><br>Interactive prototype<br>Fictional company & sample data</div></aside><main class="main" id="content"></main></div><div id="toast" class="toast hidden" role="status"></div><script>
const state={approved:false,assigned:false,generated:false,resolved:false,tour:-1};let current='overview';
const issues=[{title:'Margin is slipping despite revenue growth',desc:'Overtime and expedited freight are putting pressure on the East operation.',impact:'Margin 24.8% · 2.2 pts below plan',owner:'Elena Park · Finance',status:'Review required'}, {title:'Customer commitments need a closer look',desc:'Eight orders are at risk. Three account for 61% of the exposed order value.',impact:'$184k of order value at risk',owner:'Marcus Reed · Operations',status:'Action needed'}, {title:'One explanation is still missing',desc:'The East team has not confirmed the reason for its overtime increase.',impact:'Leadership brief has one open question',owner:'Dana Cole · East operations',status:'Awaiting input'}];
const steps=['The manual work','The executive view','Investigate a change','Review the brief','Move it forward'];
function go(page){current=page;location.hash=page;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render();window.scrollTo(0,0)}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add('hidden'),3500)}
function resetDemo(){Object.assign(state,{approved:false,assigned:false,generated:false,resolved:false,tour:-1});go('overview');toast('Demo reset. Ready for your next walkthrough.')}function startTour(){state.tour=0;go('workflow')}function nextTour(){state.tour++;go(['workflow','overview','detail','brief','actions'][state.tour]||'overview')}
function tour(){return state.tour<0?'':`<div class="walk"><strong>GUIDED DEMO · ${state.tour+1}/5</strong><span>${steps[state.tour]}</span><button onclick="${state.tour===4?'state.tour=-1;go(\'overview\')':'nextTour()'}">${state.tour===4?'Finish walkthrough':'Next step →'}</button></div>`}
function intro(k,title,sub,btn=''){return `<div class="topline"><div class="eyebrow">${k}</div><span class="tag">SYNTHETIC DATA · SIMULATED AI</span></div><div class="title-row"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${btn}</div>${tour()}`}
function footer(){return `<div class="footer"><span>Vesper Flight Systems · Week ending October 23, 2026 · USD</span><span>Simulated workflow · No live integrations · Changes stay in this session</span></div>`}
function overview(){return intro('Monday, 8:30 AM · Leadership meeting','Your week. Already in focus.','The business picture, the issues behind it, and the next decisions.',`<button class="primary" onclick="startTour()">Start the guided demo ↗</button>`)+`<div class="metrics"><div class="card metric"><label>WEEKLY REVENUE</label><div class="value">$2.46M</div><div class="metric-foot"><span class="pill green">+4.2% vs prior week</span> · Plan $2.40M</div></div><div class="card metric"><label>GROSS MARGIN</label><div class="value">24.8<span style="font-size:20px">%</span></div><div class="metric-foot"><span class="pill">−2.2 pts vs plan</span> · Plan 27.0%</div></div><div class="card metric"><label>ORDERS AT RISK</label><div class="value">8 <span style="font-size:13px;color:#839099">of 126</span></div><div class="metric-foot">$184k of order value · <span style="color:var(--orange)">Needs attention</span></div></div><div class="card metric"><label>BRIEF READINESS</label><div class="value">${state.approved?'Reviewed':'4 / 5'}</div><div class="metric-foot"><span class="pill ${state.approved?'green':''}">${state.approved?'Approved with open question':'One explanation outstanding'}</span></div></div></div><div class="grid"><section class="card"><div class="section-head"><h2>What needs your attention</h2><span class="eyebrow">3 priorities</span></div>${issues.map((x,i)=>`<div class="issue"><span class="issue-num">0${i+1}</span><div><h3>${x.title}</h3><p>${x.desc}</p><div class="issue-meta">${x.impact} &nbsp;·&nbsp; ${x.owner}</div></div><button aria-label="Investigate ${x.title}" onclick="go('${i===0?'detail':i===1?'orders':'sources'}')">↗</button></div>`).join('')}</section><section class="card"><div class="section-head"><h2>Growth, with a catch.</h2><span class="pill">Margin pressure</span></div><p class="sub" style="font-size:12px">Revenue exceeded plan. Profitability did not.</p><div class="chart" role="img" aria-label="Weekly revenue actual versus plan for weeks 40 through 43"><div class="bar-group"><div class="bar target" style="height:80%"></div><div class="bar" style="height:77%"></div></div><div class="bar-group"><div class="bar target" style="height:82%"></div><div class="bar" style="height:86%"></div></div><div class="bar-group"><div class="bar target" style="height:85%"></div><div class="bar" style="height:89%"></div></div><div class="bar-group"><div class="bar target" style="height:91%"></div><div class="bar" style="height:96%"></div></div></div><div class="chart-labels"><span>W40</span><span>W41</span><span>W42</span><span>W43</span></div><p style="font-size:10px;color:#72838c;margin-bottom:18px">● Actual revenue &nbsp; <span style="color:#b4c4c9">●</span> Plan</p><div class="note">East overtime and expedited freight together explain <strong>1.8 points</strong> of the 2.2-point margin gap. The operational cause still needs confirmation.</div><button class="question" onclick="go('detail')">Investigate the margin change →</button></section></div><div class="bottom"><span style="font-size:25px">≡</span><div><strong>Your leadership update, ready for review.</strong><p>Results, supporting evidence, and one clearly marked open question.</p></div><button class="primary" onclick="state.generated=true;go('brief')">Prepare leadership brief →</button></div>`}
function detail(){return `<button class="back" onclick="go('overview')">← Executive overview</button>`+intro('Priority 01 · Financial performance','Revenue grew. Margin didn’t.','Follow the numbers, inspect the evidence, and separate facts from assumptions.')+`<div class="grid" style="margin-top:25px"><section class="card"><div class="section-head"><h2>What explains the gap?</h2><span class="pill blue">Prepared analysis · Demo</span></div><p class="sub" style="font-size:13px">Gross margin is 24.8%, against a 27.0% plan. Two cost changes account for most of the variance.</p><table class="table"><thead><tr><th>Driver</th><th>Cost above plan</th><th>Margin effect</th></tr></thead><tbody><tr><td>East overtime</td><td>$29,520</td><td>−1.2 pts</td></tr><tr><td>Expedited freight</td><td>$14,760</td><td>−0.6 pts</td></tr><tr><td>Other net variances</td><td>$9,840</td><td>−0.4 pts</td></tr><tr><td><strong>Total</strong></td><td><strong>$54,120</strong></td><td><strong>−2.2 pts</strong></td></tr></tbody></table><div class="callout"><strong>Known:</strong> Recorded overtime and freight costs are above plan.<br><strong>Still unconfirmed:</strong> Whether the overtime increase reflects staffing, scheduling, rework, or a temporary demand spike. The demo does not infer a cause from cost alone.</div><h3>Ask a follow-up</h3><button class="question" onclick="answer('source')">Where did these numbers come from?</button><button class="question" onclick="answer('scenario')">What if overtime returned to plan?</button><button class="question" onclick="answer('missing')">What do we still need to know?</button><div id="answer" aria-live="polite"></div></section><div class="stack"><section class="card detail-stat"><div class="eyebrow">Gross margin vs plan</div><div class="big">−2.2 pts</div><p>$54,120 of weekly gross profit below plan at current revenue. This is a variance, not a validated savings opportunity.</p></section><section class="card"><h2>The next useful action</h2><p class="sub" style="font-size:12px;margin-top:12px">Request an explanation from East operations, confirm the cause, then assess the response.</p><div class="owner"><span class="avatar">DC</span><div>Dana Cole<small>East operations · Due Tuesday, Oct 27</small></div></div><button class="primary" style="margin-top:23px;width:100%" onclick="state.assigned=true;toast('Follow-up assigned in this demo. No message sent.');render()">${state.assigned?'✓ Follow-up assigned':'Assign follow-up →'}</button><button class="question" onclick="go('sources')">Inspect supporting records →</button></section></div></div>`}
function answer(type){const a={source:'The sample finance extract FIN-043 contains revenue and cost data; payroll extract PAY-043 supports overtime, and freight register LOG-043 supports expedited shipping. Margin effect = cost variance ÷ $2,460,000 revenue. Open Sources & readiness to inspect the records.',scenario:'Illustrative scenario: removing the $29,520 overtime variance would add 1.2 margin points, bringing margin to 26.0%, holding revenue and every other cost constant. This is arithmetic, not a forecast or an approved cost reduction.',missing:'We need East operations to confirm the cause of overtime, whether it will recur, and whether freight and overtime share a cause. The financial records establish the costs; they do not establish those operational explanations.'};document.getElementById('answer').innerHTML=`<div class="answer"><span class="eyebrow">Simulated response</span><br>${a[type]}</div>`}
function workflow(){return intro('The promise behind the dashboard','Give Friday afternoon back.','See which recurring tasks a connected leadership workflow could reduce.',`<button class="primary" onclick="go('overview')">See the executive view →</button>`)+`<div class="before-after"><section class="card"><span class="pill">Today · People assemble the picture</span><h2 style="margin-top:18px">AI helps with the writing.<br>The gathering is still manual.</h2><ul class="process"><li>01 &nbsp; Export finance and operations reports<small>Different files, reporting periods, and definitions.</small></li><li>02 &nbsp; Reconcile the spreadsheet<small>Check totals, copy figures, and resolve mismatches.</small></li><li>03 &nbsp; Chase the explanation<small>Ask department heads what changed and why.</small></li><li>04 &nbsp; Draft the leadership update<small>Paste information into AI, then verify and reformat it.</small></li><li>05 &nbsp; Turn meeting notes into follow-ups<small>Find the owner, write the task, and chase it next week.</small></li></ul></section><section class="card" style="background:#edf3f2"><span class="pill green">Proposed · People review and decide</span><h2 style="margin-top:18px">The information connects.<br>The team keeps control.</h2><ul class="process"><li>01 &nbsp; Bring approved sources into one view<small>In production: connect systems and agree on definitions.</small></li><li>02 &nbsp; Check readiness before summarizing<small>Show freshness, missing inputs, and reconciliation issues.</small></li><li>03 &nbsp; Surface changes with supporting evidence<small>Distinguish recorded facts from unconfirmed explanations.</small></li><li>04 &nbsp; Prepare a brief for human review<small>Results, issues, assumptions, and open questions together.</small></li><li>05 &nbsp; Record decisions and assign owners<small>Keep the next action visible after the meeting.</small></li></ul></section></div><div class="bottom"><div><strong>Measure the work before promising a saving.</strong><p>Baseline preparation hours, people involved, corrections, and overdue follow-ups. Compare after a pilot.</p></div></div>`}
const sources=[['FIN-043','Finance · Weekly actuals & plan','Finance export · Oct 23, 5:00 PM','Ready'],['PAY-043','Payroll · East overtime','Payroll extract · Oct 23, 4:30 PM','Ready'],['LOG-043','Logistics · Expedited freight','Freight register · Oct 23, 5:15 PM','Ready'],['ORD-043','Operations · Open orders','Order extract · Oct 23, 5:30 PM','Ready'],['OPS-043','East operations · Variance explanation','Department commentary · Not received','Missing']];
function sourcesPage(){return intro('Evidence & readiness','Know what’s behind the update.','Sample source records are inspectable. Missing information stays visible.')+`<div class="grid" style="margin-top:25px"><section class="card"><div class="section-head"><h2>Source register</h2><span class="pill">4 ready · 1 missing</span></div>${sources.map((s,i)=>`<div class="source"><span class="avatar">${i===4?'!':'✓'}</span><div><strong>${s[1]}</strong><p>${s[2]}</p></div><button class="secondary" onclick="sourceDetail(${i})">${s[3]==='Missing'?'View gap':'Inspect'}</button></div>`).join('')}<div id="source-detail" aria-live="polite"></div></section><section class="card"><h2>An honest readiness check.</h2><div class="callout">The financial results can be reviewed. The cause of East overtime cannot yet be confirmed.</div><p class="sub" style="font-size:13px">The brief carries the open question forward. Approval acknowledges that gap; it does not turn an assumption into a fact.</p><button class="primary" style="margin-top:22px" onclick="state.assigned=true;toast('Input request recorded in the demo. No email sent.')">Request missing explanation →</button><div class="note" style="margin-top:23px">All records are synthetic, with a fixed demo reporting period. No systems are connected and no background refresh occurs.</div></section></div>`}
function sourceDetail(i){let body=[`Revenue: $2,460,000 · Planned revenue: $2,400,000<br>Gross profit: $610,080 · Planned margin at actual revenue: 27.0%<br>Actual margin: $610,080 ÷ $2,460,000 = 24.8%.`, `East overtime: actual $47,520 · plan $18,000<br>Variance: $29,520 · Margin effect: 1.2 points.<br>Operational explanation: not received.`, `Expedited freight: actual $26,760 · plan $12,000<br>Variance: $14,760 · Margin effect: 0.6 points.<br>Cause and recurrence: require operational review.`, `126 open orders · 8 flagged at risk · $184,000 exposed order value.<br>Three largest at-risk orders: $45,000 + $38,000 + $29,240 = $112,240 (61%).<br>Order value is not a forecast of lost revenue.`, `Missing: explanation for East overtime variance.<br>Required from Dana Cole: cause, expected duration, and proposed response.<br>Due Tuesday, Oct 27. Status: ${state.assigned?'Follow-up assigned':'Awaiting assignment'}.`][i];document.getElementById('source-detail').innerHTML=`<div class="answer"><strong>${sources[i][0]} · Synthetic record</strong><br>${body}</div>`}
function brief(){return intro('Leadership update · Prepared for review','The brief is ready. You decide.','Review the evidence, keep the open question visible, and approve when ready.')+`<div class="actions"><button class="primary" onclick="approve()">${state.approved?'✓ Approved with open question':'Approve with open question'}</button><button class="secondary" onclick="downloadBrief()">Download brief ↓</button><button class="secondary" onclick="window.print()">Print / Save PDF</button><button class="secondary" onclick="go('sources')">Review sources</button></div><article class="brief"><div class="section-head"><div class="eyebrow">Vesper Flight Systems · Executive briefing</div><span class="pill ${state.approved?'green':''}">${state.approved?'Reviewed in demo':'Draft · Human review required'}</span></div><h2>Growth is holding.<br>Margin needs attention.</h2><p>Week ending October 23, 2026 · Prepared from four synthetic source extracts.</p><h3>01 / Performance at a glance</h3><p>Weekly revenue reached $2.46M, 2.5% above the $2.40M plan and 4.2% above the prior week. Gross margin was 24.8%, compared with a 27.0% plan: a $54,120 gross profit gap at actual revenue.</p><h3>02 / What changed</h3><p>East overtime exceeded plan by $29,520 and expedited freight by $14,760. Together these explain 1.8 points of the 2.2-point margin gap. Other net variances explain 0.4 points. Sources: FIN-043, PAY-043, LOG-043.</p><h3>03 / Customer commitments</h3><p>Eight of 126 open orders are flagged at risk, representing $184,000 of order value. Three account for 61% of that exposure. This is an operational risk indicator, not a forecast of lost revenue. Source: ORD-043.</p><div class="callout"><strong>Open question · OPS-043</strong><br>East operations has not confirmed the cause or expected duration of overtime. Staffing, scheduling, rework, and demand are possible explanations requiring confirmation; none is established by these records.</div><h3>04 / Proposed next steps</h3><ul><li>Dana Cole: confirm the overtime cause, recurrence, and response by Tuesday, Oct 27.</li><li>Marcus Reed: review the eight orders and confirm customer recovery plans by Monday, Oct 26.</li><li>Elena Park: validate next week’s variance after operations provides context.</li></ul><h3>05 / Decision for leadership</h3><p>Confirm owners and request operational evidence before approving a cost response. No staffing or spending changes are recommended from this financial variance alone.</p><div class="note" style="margin-top:24px">${state.approved?'Approved in this demo with the open operational question explicitly retained.':'Approval pending. Figures and narrative require review.'} Synthetic data · Simulated preparation · No live integrations.</div></article>`}
function approve(){if(!state.approved&&!confirm('Approve this demo brief with the missing East operations explanation explicitly retained as an open question?'))return;state.approved=true;render();toast('Brief approved in demo. Open question retained; confirm action owners next.')}
function orders(){return `<button class="back" onclick="go('overview')">← Executive overview</button>`+intro('Priority 02 · Customer commitments','Eight orders. One focused review.','Identify the exposed commitments and assign a recovery review.')+`<section class="card" style="margin-top:25px"><h2>Largest at-risk commitments</h2><table class="table"><tr><th>Sample order</th><th>Order value</th><th>Flag</th><th>Owner</th></tr><tr><td>VF-1048</td><td>$45,000</td><td>Final calibration ran late</td><td>Marcus Reed</td></tr><tr><td>VF-1071</td><td>$38,000</td><td>Material confirmation pending</td><td>Marcus Reed</td></tr><tr><td>VF-1092</td><td>$29,240</td><td>Shipping window at risk</td><td>Marcus Reed</td></tr><tr><td>Five additional orders</td><td>$71,760</td><td>Requires operational review</td><td>Operations</td></tr></table><p class="sub">$184,000 total exposed order value. These flags require confirmation; they do not establish a missed delivery or lost revenue.</p><button class="primary" style="margin-top:20px" onclick="state.assigned=true;go('actions');toast('Recovery review assigned in demo.')">Assign recovery review →</button></section>`}
function actions(){return intro('Decisions & follow-through','Keep the next step in sight.','Every issue has an owner. Every open question stays open until answered.')+`<section class="card" style="margin-top:25px"><div class="section-head"><h2>Meeting action register</h2><span class="pill blue">Session-only demo</span></div><table class="table"><thead><tr><th>Action</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody><tr><td>Confirm East overtime cause</td><td>Dana Cole</td><td>Oct 27</td><td><span class="pill">${state.assigned?'Assigned · awaiting input':'Proposed'}</span></td></tr><tr><td>Review eight at-risk orders</td><td>Marcus Reed</td><td>Oct 26</td><td><span class="pill">${state.assigned?'Assigned':'Proposed'}</span></td></tr><tr><td>Validate follow-up margin analysis</td><td>Elena Park</td><td>Oct 30</td><td><span class="pill blue">Waiting on operations</span></td></tr><tr><td>Review leadership brief</td><td>Executive sponsor</td><td>Oct 26</td><td><span class="pill ${state.approved?'green':''}">${state.approved?'Approved with open question':'Review pending'}</span></td></tr></tbody></table><div class="actions"><button class="primary" onclick="state.assigned=true;render();toast('Owners confirmed in demo. No external notifications sent.')">${state.assigned?'✓ Owners confirmed':'Confirm action owners'}</button><button class="secondary" onclick="go('brief')">Review leadership brief →</button></div></section><div class="bottom"><div><strong>Which recurring update consumes your team’s time?</strong><p>Start with one report, its sources, the people preparing it, and the decisions it supports.</p></div><button class="primary" onclick="go('pilot')">Explore your first workflow →</button></div>`}
function pilot(){return intro('From demonstration to your business','Start with one recurring workflow.','A practical first conversation about work your team already does.')+`<div class="grid" style="margin-top:25px"><section class="card"><h2>Bring one report or meeting.</h2><ul class="process"><li><strong>What gets prepared?</strong><small>A weekly update, monthly review, customer report, or operating meeting.</small></li><li><strong>Where does the information live?</strong><small>The reports, systems, spreadsheets, and people involved.</small></li><li><strong>Where does the effort go?</strong><small>Gathering, reconciliation, explanations, drafting, and follow-up.</small></li><li><strong>What would make it worth doing?</strong><small>Agree on a measurable outcome and a bounded pilot.</small></li></ul><a class="primary" style="display:inline-block;text-decoration:none;margin-top:12px" href="https://nine-67.com" target="_blank" rel="noopener">Visit Nine-67 ↗</a></section><section class="card detail-stat"><div class="eyebrow">The first milestone</div><h2 style="margin:22px 0">A brief your team<br>can trust and use.</h2><p>A production implementation needs agreed metrics, authorized source access, reconciliation, permission controls, evaluation, and a clear human review process.</p><div class="note" style="color:#bdcdd3;border-color:#3b5260;margin-top:25px">This prototype demonstrates the experience. It does not connect to company systems, run live AI, or establish measured savings.</div></section></div>`}
function downloadBrief(){const text=`VESPER FLIGHT SYSTEMS — LEADERSHIP BRIEF\nWeek ending October 23, 2026\nSynthetic data · Simulated AI · No live integrations\n\nRevenue: $2.46M; plan $2.40M. Gross margin: 24.8%; plan 27.0%. Gross profit gap at actual revenue: $54,120.\n\nDrivers: overtime $29,520 (1.2 pts), expedited freight $14,760 (0.6 pts), other net variances $9,840 (0.4 pts). Sources FIN-043, PAY-043, LOG-043.\n\n8 of 126 orders at risk; $184,000 order value. Three orders account for 61%. Not a lost-revenue forecast. Source ORD-043.\n\nOPEN QUESTION: East operations has not confirmed overtime cause or recurrence. Source OPS-043 missing.\n\nACTIONS\nDana Cole: confirm cause and response, Oct 27.\nMarcus Reed: review at-risk orders, Oct 26.\nElena Park: validate follow-up variance, Oct 30.\n\nSTATUS: ${state.approved?'Approved in demo with open question retained':'Draft — human review required'}.\n`;const url=URL.createObjectURL(new Blob([text],{type:'text/plain'}));let a=document.createElement('a');a.href=url;a.download='Vesper-Leadership-Brief.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function render(){const pages={overview,detail,workflow,sources:sourcesPage,brief,actions,orders,pilot};document.getElementById('content').innerHTML=(pages[current]||overview)()+footer()}const entryHash=location.hash;window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#webinar'))return;const p=location.hash.slice(1)||'overview';if(p!==current)go(p)});if(!entryHash.startsWith('#webinar'))go(location.hash.slice(1)||'overview');else render();
</script><script src="webinar.js"></script></body></html>
